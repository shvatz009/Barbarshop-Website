<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" , initial-scale="1.0" />
    <title>Vintage Barbershop</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <!-- =========== Header/Navbar=========-->
    <header class="site-header">
      <div class="container header-inner">
        <a href="/assets/images/logo (1).png" class="logo" id="logo"
          >Vintage Barbershop</a
        >
        <nav class="nav" id="nav">
          <a href="#features" class="nav-link">Services</a>
          <a href="#cts" class="nav-link">Book</a>
          <a href="#footer" class="nav-link">Contact</a>
        </nav>
        <!-- Mobile Menu Button (for later JS)-->
        <button class="menu-btn" id="menuBtn" aria-label="Open Menu">≡</button>
      </div>
      <!-- Mobile Menu Panel (for later JS)-->
      <div class="mobile-menu" id="mobileMenu">
        <a href="#features" class="mobile-link">Services</a>
        <a href="#cta" class="mobile-link">Book</a>
        <a href="#footer" class="mobile-link">Contact</a>
      </div>
    </header>
    <!-- ======== HERO SECTION ========= -->
    <section class="hero" id="hero">
      <div class="container hero-inner">
        <div class="hero-text">
          <h1 id="heroHeading">Classic Cuts. Clean Shaves. Vintage Styles.</h1>
          <p id="heroSubtext">
            Experience the tradition of a true barbershop- precision fades,
            stright-razor shaves, and a welcoming atmosphere.
          </p>
          <div class="hero-actions">
            <a href="#cta" class="btn btn-primary" id="bookBtn"
              >Book an Appointment</a
            >
            <a href="#features" class="btn btn-secondary" id="serviceBtn"
              >View Services</a
            >
          </div>
        </div>
        <div class="hero-media">
          <!-- Replace src with your provided hero image -->
          <img
            src="/assets/images/hero.jpg"
            alt="Barbershop hero"
            class="hero-img"
            id="heroImg"
          />
        </div>
      </div>
    </section>
  </body>
</html>
